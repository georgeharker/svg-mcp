# The reference theme. It is almost entirely roles: a vocabulary of diagram kinds, edge kinds,
# and text roles, with no bare .shape/.text/.connector/.container/.image rule (see styles.css)
# — a plain rect stays a plain rect, so serving those categories would be an empty claim and is
# deliberately not made. `chart` is the one exception, and an honest one: there is no such thing
# as an unstyled chart, so the category IS served and a themeless document still gets axes it
# can read.
name = "default"

[serves]
categories = ["chart"]

roles = [
  # text roles
  "title",
  "subtitle",
  "label",
  "caption",
  "code",
  # diagram node kinds
  "service",
  "datastore",
  "queue",
  "external",
  "decision",
  "note",
  # edge kinds
  "data",
  "control",
  "dependency",
  # container kinds
  "cluster",
  "zone",
  "swimlane",
  # annotation: the legend's box, the table's panel, and the five things a callout (or a callout
  # card) can be. `note` is deliberately NOT repeated here — a callout that is commentary wears
  # the same pale sticky a note node does.
  "legend",
  "table",
  "info",
  "warning",
  "success",
  "danger",
]

# The primitive each diagram kind wants when a facade draws it — the shape half of a role,
# where styles.css carries the paint half.
[kinds]
service = "squircle"
datastore = "rect"
queue = "pill"
external = "rect"
decision = "polygon"
note = "rect"

[variants]
dark = "variants/dark.css"
